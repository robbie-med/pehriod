<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="48%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="26%" r="58%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#7f1d1d" flood-opacity="0.40"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Radial inner glow (top-left) -->
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>

  <!-- Teardrop drop shadow -->
  <path d="M 256 88 C 322 158 392 215 392 310 A 136 136 0 0 1 120 310 C 120 215 190 158 256 88 Z"
        fill="#4c0519" fill-opacity="0.28" transform="translate(4 14)"/>

  <!-- Main white teardrop (pointing up) -->
  <!-- Arc: from (392,310) clockwise through (256,446) to (120,310), radius 136, center (256,310) -->
  <path d="M 256 88 C 322 158 392 215 392 310 A 136 136 0 0 1 120 310 C 120 215 190 158 256 88 Z"
        fill="white" fill-opacity="0.96" filter="url(#dropShadow)"/>

  <!-- Inner highlight — left shoulder shimmer for depth -->
  <path d="M 256 128 C 210 188 148 244 136 306 C 129 278 130 256 144 233 C 168 195 212 160 256 128 Z"
        fill="white" fill-opacity="0.28"/>

  <!-- Right inner highlight strip -->
  <path d="M 256 88 C 310 150 370 200 385 275 C 370 218 322 158 256 88 Z"
        fill="white" fill-opacity="0.12"/>

  <!-- Sparkle constellation — upper right -->
  <!-- Large dot -->
  <circle cx="370" cy="102" r="13" fill="white" fill-opacity="0.72"/>
  <!-- Medium dot -->
  <circle cx="406" cy="150" r="8" fill="white" fill-opacity="0.54"/>
  <!-- Small dot -->
  <circle cx="347" cy="72" r="5.5" fill="white" fill-opacity="0.44"/>
  <!-- Tiny accent -->
  <circle cx="415" cy="108" r="3.5" fill="white" fill-opacity="0.35"/>
</svg>
